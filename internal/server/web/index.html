<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="appTitle">LongCat-frontend</title>

<style>
/* ============================================================
   Design tokens — aligned with grok-app design-tokens.md
   极深暗色、低对比分隔、克制高亮、圆角无边框壳
   ============================================================ */
:root,[data-theme="dark"]{
  color-scheme:dark;
  --radius-lg:10px;--radius-md:8px;--radius-sm:6px;--radius-full:9999px;
  --sidebar-width:260px;--titlebar-height:40px;--input-min-height:52px;--control-height:32px;
  --font-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  --font-mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
  --text-xs:12px;--text-sm:13px;--text-md:14px;--text-lg:16px;
  --motion-fast:120ms;--motion-normal:200ms;

  --bg-app:#0d0d0d;--bg-sidebar:#101010;--bg-main:#151515;
  --bg-elevated:#1a1a1a;--bg-overlay:rgba(0,0,0,.55);
  --bg-hover:rgba(255,255,255,.05);--bg-active:rgba(255,255,255,.08);
  --bg-input:#121212;--bg-code:#0a0a0a;--bg-user-bubble:#2a2a2e;

  --glass-surface:rgba(28,28,30,.72);--glass-border:rgba(255,255,255,.12);
  --glass-blur:48px;--glass-saturate:1.85;
  --glass-shadow:0 0 0 .5px rgba(255,255,255,.08) inset,0 8px 28px rgba(0,0,0,.4),0 24px 64px rgba(0,0,0,.32);

  --border-subtle:rgba(255,255,255,.06);--border-strong:rgba(255,255,255,.12);
  --border-focus:rgba(140,170,255,.55);

  --text-primary:rgba(255,255,255,.92);--text-secondary:rgba(255,255,255,.58);
  --text-tertiary:rgba(255,255,255,.38);--text-inverse:#0d0d0d;

  --accent:#8aa4ff;--accent-muted:rgba(138,164,255,.14);--accent-hover:#a0b6ff;--accent-fg:#0d0d0d;
  --success:#3ecf8e;--success-muted:rgba(62,207,142,.14);
  --warning:#f0993d;--warning-muted:rgba(240,153,61,.16);
  --danger:#f07178;--danger-muted:rgba(240,113,120,.14);
  --info:#6cb6ff;--info-muted:rgba(108,182,255,.14);
  --longcat:#29E154;

  --scrollbar-thumb:rgba(255,255,255,.3);
}
[data-theme="light"]{
  color-scheme:light;
  --bg-app:#f4f4f6;--bg-sidebar:#ececef;--bg-main:#ffffff;
  --bg-elevated:#ffffff;--bg-overlay:rgba(20,20,24,.4);
  --bg-hover:rgba(0,0,0,.04);--bg-active:rgba(0,0,0,.06);
  --bg-input:#ffffff;--bg-code:#f0f0f2;--bg-user-bubble:#e8e8ed;
  --glass-surface:rgba(255,255,255,.72);--glass-border:rgba(0,0,0,.08);
  --glass-shadow:0 0 0 .5px rgba(255,255,255,.7) inset,0 8px 28px rgba(0,0,0,.1),0 20px 48px rgba(0,0,0,.08);
  --border-subtle:rgba(0,0,0,.06);--border-strong:rgba(0,0,0,.1);
  --border-focus:rgba(70,100,220,.55);
  --text-primary:rgba(0,0,0,.88);--text-secondary:rgba(0,0,0,.55);--text-tertiary:rgba(0,0,0,.36);
  --text-inverse:#ffffff;
  --accent:#3d5fd9;--accent-muted:rgba(61,95,217,.1);--accent-hover:#2f4fc4;--accent-fg:#ffffff;
  --success:#1a9f63;--success-muted:rgba(26,159,99,.12);
  --warning:#e07020;--warning-muted:rgba(224,112,32,.12);
  --danger:#d13b45;--danger-muted:rgba(209,59,69,.1);
  --info:#2a7ed4;--info-muted:rgba(42,126,212,.1);
  --scrollbar-thumb:rgba(0,0,0,.24);
}
@media(prefers-reduced-motion:reduce){:root{--motion-fast:0ms;--motion-normal:0ms}}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:var(--text-sm);color:var(--text-primary);
  background:var(--bg-app);line-height:1.55;overflow:hidden;
  transition:background var(--motion-normal),color var(--motion-normal)}

/* ============ Layout: 左栏 + 主区（近黑三栏骨架） ============ */
.app{display:flex;height:100vh}

/* ---- Sidebar ---- */
.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--bg-sidebar);
  display:flex;flex-direction:column;user-select:none;
  box-shadow:inset -1px 0 0 var(--border-subtle)}
.sb-top{height:var(--titlebar-height);display:flex;align-items:center;gap:8px;padding:0 14px;flex-shrink:0}
.sb-logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--text-md);letter-spacing:-.01em}
.sb-logo svg{width:20px;height:20px;flex-shrink:0}
.sb-top .grow{flex:1}
.icon-btn{width:28px;height:28px;border:none;background:none;border-radius:var(--radius-sm);
  color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:13px;transition:background var(--motion-fast),color var(--motion-fast)}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.icon-btn:focus-visible{outline:2px solid var(--border-focus);outline-offset:1px}

.sb-search{margin:2px 12px 10px;position:relative}
.sb-search input{width:100%;background:var(--bg-input);border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);padding:6px 10px 6px 28px;font-size:var(--text-xs);
  color:var(--text-primary);outline:none;transition:border var(--motion-fast)}
.sb-search input::placeholder{color:var(--text-tertiary)}
.sb-search input:focus{border-color:var(--border-focus)}
.sb-search .si{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  color:var(--text-tertiary);font-size:12px;pointer-events:none}

.sb-body{flex:1;overflow-y:auto;padding:0 8px}
.sb-nav{display:flex;flex-direction:column;gap:1px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:var(--radius-md);
  font-size:var(--text-sm);color:var(--text-secondary);cursor:pointer;border:none;background:none;
  width:100%;text-align:left;transition:background var(--motion-fast),color var(--motion-fast)}
.nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-item.active{background:var(--bg-active);color:var(--text-primary);font-weight:500}
.nav-item .ni{width:16px;text-align:center;font-size:13px;flex-shrink:0;opacity:.85}

.sb-title{font-size:11px;font-weight:600;color:var(--text-tertiary);letter-spacing:.05em;
  text-transform:uppercase;padding:10px 10px 5px}

.provider-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-md);
  cursor:pointer;transition:background var(--motion-fast)}
.provider-row:hover{background:var(--bg-hover)}
.provider-row.active{background:var(--bg-active)}
.pr-dot{width:7px;height:7px;border-radius:var(--radius-full);background:var(--text-tertiary);flex-shrink:0}
.provider-row.active .pr-dot{background:var(--success);box-shadow:0 0 6px var(--success)}
.pr-name{font-size:var(--text-xs);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-info{font-size:10.5px;color:var(--text-tertiary);margin-left:auto;flex-shrink:0}
.sb-empty{font-size:var(--text-xs);color:var(--text-tertiary);padding:4px 10px;line-height:1.6}

.skill-item{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:var(--radius-md);
  font-size:var(--text-xs);color:var(--text-secondary);transition:background var(--motion-fast);cursor:default}
.skill-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.skill-item .sd{width:5px;height:5px;border-radius:var(--radius-full);background:var(--longcat);flex-shrink:0;opacity:.7}

.sb-footer{padding:10px 14px;display:flex;align-items:center;gap:8px;
  font-size:11px;color:var(--text-tertiary);box-shadow:inset 0 1px 0 var(--border-subtle)}
.sb-footer .status-dot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--success)}

/* ---- Main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-main)}
.titlebar{height:var(--titlebar-height);display:flex;align-items:center;justify-content:flex-end;
  gap:2px;padding:0 10px;flex-shrink:0}

/* Chat area */
.chat-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:12px 32px}

/* Welcome — 线框/单色，克制 */
.welcome{margin:auto;text-align:center;max-width:640px;width:100%;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.welcome-logo{width:56px;height:56px;margin:0 auto 18px;opacity:.95}
.welcome-logo svg{width:100%;height:100%}
.welcome h1{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}

/* Messages */
.msg-list{width:100%;max-width:760px;display:flex;flex-direction:column;gap:18px;padding:12px 0}
.msg{animation:fade .2s ease}
/* 用户气泡：右对齐、elevated 底 */
.msg.user{align-self:flex-end;max-width:85%}
.msg.user .msg-body{background:var(--bg-user-bubble);border-radius:var(--radius-lg);
  padding:10px 14px;font-size:var(--text-sm);white-space:pre-wrap;word-break:break-word}
/* Agent：透明底、无边框（grok 风格） */
.msg.assistant{align-self:stretch}
.msg-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.msg-avatar{width:22px;height:22px;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bg-elevated)}
.msg-avatar svg{width:14px;height:14px}
.msg-who{font-size:var(--text-xs);color:var(--text-tertiary)}
.msg.assistant .msg-body{font-size:var(--text-sm);line-height:1.7;white-space:pre-wrap;word-break:break-word;
  color:var(--text-primary)}
.msg-body pre{background:var(--bg-code);border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  padding:12px 14px;overflow-x:auto;font-family:var(--font-mono);font-size:var(--text-xs);
  white-space:pre;margin:10px 0;line-height:1.6;color:var(--text-secondary)}
/* Code block with header (lang + copy) */
.code-block{margin:10px 0;border:1px solid var(--border-subtle);border-radius:var(--radius-md);
  overflow:hidden;background:var(--bg-code)}
.code-head{display:flex;justify-content:space-between;align-items:center;
  padding:5px 12px;background:var(--bg-elevated);border-bottom:1px solid var(--border-subtle)}
.code-lang{color:var(--accent);font-family:var(--font-mono);font-size:10.5px;font-weight:500}
.code-copy{border:none;background:none;color:var(--text-tertiary);cursor:pointer;
  font-size:10.5px;font-family:inherit;padding:2px 7px;border-radius:var(--radius-sm);
  transition:all var(--motion-fast)}
.code-copy:hover{color:var(--text-primary);background:var(--bg-hover)}
.code-block pre{margin:0;border:none;border-radius:0}
/* Streaming cursor */
.stream-cursor{display:inline-block;width:7px;height:15px;background:var(--accent);
  vertical-align:text-bottom;margin-left:2px;border-radius:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.skill-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.st-tag{font-size:10.5px;color:var(--longcat);border:1px solid color-mix(in srgb,var(--longcat) 30%,transparent);
  border-radius:var(--radius-full);padding:1px 8px;background:color-mix(in srgb,var(--longcat) 7%,transparent)}

/* ---- Composer ---- */
.composer-wrap{padding:0 32px 14px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.composer-inner{width:100%;max-width:760px}
.context-bar{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;min-height:22px}
.ctx-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;
  background:var(--bg-hover);border-radius:var(--radius-sm);
  font-size:11px;color:var(--text-secondary)}
.composer{display:flex;flex-direction:column;background:var(--bg-input);
  border:1px solid var(--border-subtle);border-radius:14px;
  min-height:var(--input-min-height);padding:10px 12px 8px;
  transition:border var(--motion-fast)}
.composer:focus-within{border-color:var(--border-focus)}
.composer textarea{resize:none;border:none;background:none;color:var(--text-primary);
  font-size:var(--text-sm);font-family:inherit;line-height:1.5;outline:none;
  min-height:22px;max-height:160px;width:100%}
.composer textarea::placeholder{color:var(--text-tertiary)}
.composer-tools{display:flex;align-items:center;gap:2px;margin-top:8px}
.composer-tools .grow{flex:1}
.chip-btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;
  border:none;background:var(--bg-hover);border-radius:var(--radius-sm);
  font-size:11px;color:var(--text-secondary);cursor:pointer;font-family:inherit;
  transition:background var(--motion-fast),color var(--motion-fast)}
.chip-btn:hover{background:var(--bg-active);color:var(--text-primary)}
.send-btn{width:30px;height:30px;border:none;border-radius:var(--radius-full);
  background:var(--accent);color:var(--accent-fg);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:background var(--motion-fast),opacity var(--motion-fast)}
.send-btn:hover{background:var(--accent-hover)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.composer-hint{font-size:11px;color:var(--text-tertiary);text-align:center;padding:7px 0 0}

/* ---- Preview pane ---- */
.preview-pane{width:42%;min-width:340px;background:var(--bg-sidebar);display:none;flex-direction:column;
  box-shadow:inset 1px 0 0 var(--border-subtle)}
.preview-pane.open{display:flex}
.pp-head{height:var(--titlebar-height);display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;font-size:var(--text-xs);color:var(--text-secondary);flex-shrink:0}
.pp-frame{flex:1;border:0;background:#fff;border-radius:var(--radius-md);margin:0 10px 10px}

/* ---- Glass Modal（玻璃拟态浮层） ---- */
.overlay{position:fixed;inset:0;background:var(--bg-overlay);display:none;
  align-items:center;justify-content:center;z-index:100}
.overlay.open{display:flex}
.modal{width:680px;max-height:84vh;overflow-y:auto;
  background:var(--glass-surface);border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border-radius:16px;padding:20px 24px;box-shadow:var(--glass-shadow);animation:fade .18s ease}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h2{font-size:var(--text-lg);font-weight:600}

/* Provider table */
.ptable{width:100%;border-collapse:collapse;margin-bottom:18px}
.ptable th{text-align:left;font-size:11px;font-weight:600;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.05em;padding:7px 8px;
  border-bottom:1px solid var(--border-subtle)}
.ptable td{padding:8px;border-bottom:1px solid var(--border-subtle);
  font-size:var(--text-xs);vertical-align:middle}
.ptable tr:hover td{background:var(--bg-hover)}
.p-actions{display:flex;gap:4px}
.p-btn{width:26px;height:26px;border:1px solid var(--border-subtle);background:none;
  border-radius:var(--radius-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--text-secondary);transition:all var(--motion-fast)}
.p-btn:hover{border-color:var(--border-strong);color:var(--text-primary);background:var(--bg-hover)}
.p-btn.danger:hover{border-color:var(--danger);color:var(--danger);background:var(--danger-muted)}

/* Form */
.form-label{font-size:11px;font-weight:500;color:var(--text-secondary);margin-bottom:4px;display:block}
.form-input,.form-select{width:100%;background:var(--bg-input);border:1px solid var(--border-subtle);
  color:var(--text-primary);border-radius:var(--radius-md);padding:8px 10px;
  font-size:var(--text-xs);outline:none;font-family:inherit;transition:border var(--motion-fast)}
.form-input::placeholder{color:var(--text-tertiary)}
.form-input:focus,.form-select:focus{border-color:var(--border-focus)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--border-subtle)}

.btn{border:1px solid var(--border-subtle);background:none;color:var(--text-primary);
  border-radius:var(--radius-md);padding:7px 15px;font-size:var(--text-xs);font-weight:500;
  cursor:pointer;font-family:inherit;transition:all var(--motion-fast)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-strong)}
.btn-primary{background:var(--accent);border-color:transparent;color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover);border-color:transparent}

/* Toast */
.toast{position:fixed;bottom:48px;left:50%;transform:translateX(-50%) translateY(6px);
  background:var(--glass-surface);border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-saturate));
  border-radius:var(--radius-lg);padding:9px 18px;font-size:var(--text-xs);
  box-shadow:var(--glass-shadow);opacity:0;pointer-events:none;
  transition:all var(--motion-normal);z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Scrollbar — overlay style */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:transparent;border-radius:var(--radius-full)}
:hover::-webkit-scrollbar-thumb,*:hover>::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

<div class="app">

<!-- ========== Sidebar ========== -->
<aside class="sidebar">
  <div class="sb-top">
    <div class="sb-logo">
      <svg><use href="#longcat"/></svg>
      <span data-i18n="appName">LongCat-frontend</span>
    </div>
    <div class="grow"></div>
    <button class="icon-btn" id="btnLang" title="Language">中</button>
  </div>
  <div class="sb-search">
    <span class="si">⌕</span>
    <input type="text" id="sbSearch" data-i18n-ph="searchPlaceholder" placeholder="搜索…">
  </div>
  <div class="sb-body">
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-title" data-i18n="providersTitle">供应商</div>
    <div id="providerList"></div>
    <div class="sb-title" data-i18n="skillsTitle">前端技能</div>
    <div id="skillList"></div>
  </div>
  <div class="sb-footer">
    <span class="status-dot" id="connDot"></span>
    <span id="connText" data-i18n="connected">已连接</span>
    <span style="flex:1"></span>
    <span>v0.2.0</span>
  </div>
</aside>

<!-- ========== Main ========== -->
<div class="main">
  <div class="titlebar">
    <button class="icon-btn" id="btnTheme" data-i18n-title="toggleTheme" title="切换主题">◐</button>
    <button class="icon-btn" id="btnPreviewToggle" data-i18n-title="preview" title="预览">▤</button>
    <button class="icon-btn" id="btnSettings" data-i18n-title="settings" title="设置">⚙</button>
  </div>

  <div class="chat-area" id="chatArea">
    <!-- Welcome -->
    <div class="welcome" id="welcome">
      <div class="welcome-logo"><svg><use href="#longcat"/></svg></div>
      <h1 data-i18n="welcomeTitle">今天想构建什么？</h1>
    </div>
    <!-- Messages -->
    <div class="msg-list" id="msgList" style="display:none"></div>
  </div>

  <!-- Composer -->
  <div class="composer-wrap">
    <div class="composer-inner">
      <div class="context-bar" id="contextBar"></div>
      <div class="composer">
        <textarea id="input" rows="1" data-i18n-ph="inputPlaceholder"
          placeholder="描述你想要的组件、页面或前端问题…"></textarea>
        <div class="composer-tools">
          <button class="chip-btn" id="chipModel">—</button>
          <button class="chip-btn" id="chipReset" data-i18n="resetChip">↺ 重置</button>
          <div class="grow"></div>
          <button class="send-btn" id="btnSend" title="Enter">↑</button>
        </div>
      </div>
      <div class="composer-hint" data-i18n="inputHint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>
</div>

<!-- ========== Preview ========== -->
<div class="preview-pane" id="previewPane">
  <div class="pp-head">
    <span data-i18n="previewTitle">实时预览</span>
    <button class="icon-btn" onclick="togglePreview()">✕</button>
  </div>
  <iframe class="pp-frame" id="previewFrame" sandbox="allow-scripts"></iframe>
</div>

</div><!-- /app -->

<!-- ========== Provider Modal (glass) ========== -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 data-i18n="providerModalTitle">LLM 供应商管理</h2>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <table class="ptable">
      <thead><tr>
        <th></th><th data-i18n="thID">ID</th><th data-i18n="thProtocol">协议</th>
        <th data-i18n="thModel">模型</th><th data-i18n="thKey">密钥</th>
        <th style="width:120px" data-i18n="thActions">操作</th>
      </tr></thead>
      <tbody id="ptbody"></tbody>
    </table>
    <div class="sb-title" style="padding-left:0" id="formTitle" data-i18n="addProvider">添加供应商</div>
    <div class="form-grid">
      <div><label class="form-label" data-i18n="lblID">标识符</label>
        <input class="form-input" id="f_id" placeholder="my-openai"></div>
      <div><label class="form-label" data-i18n="lblProtocol">通信协议</label>
        <select class="form-select" id="f_protocol"></select></div>
      <div class="full"><label class="form-label" data-i18n="lblURL">Base URL</label>
        <input class="form-input" id="f_url" placeholder="https://api.openai.com/v1"></div>
      <div class="full"><label class="form-label" data-i18n="lblKey">API Key</label>
        <input class="form-input" id="f_key" type="password" placeholder="sk-..."></div>
      <div><label class="form-label" data-i18n="lblModel">模型名称</label>
        <input class="form-input" id="f_model" placeholder="gpt-4o-mini"></div>
      <div><label class="form-label" data-i18n="lblPriority">优先级</label>
        <input class="form-input" id="f_priority" type="number" value="0"></div>
    </div>
    <div class="form-actions">
      <button class="btn" id="btnResetForm" data-i18n="clearBtn">清空</button>
      <button class="btn btn-primary" id="btnSave" data-i18n="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// i18n
// ============================================================
const I18N={
 'zh-CN':{
  appName:'LongCat-frontend',appTitle:'LongCat-frontend',
  searchPlaceholder:'搜索…',
  navChat:'对话',navSkills:'技能',navProviders:'供应商',
  providersTitle:'供应商',skillsTitle:'前端技能',
  connected:'已连接',disconnected:'未连接',
  welcomeTitle:'今天想构建什么？',
  inputPlaceholder:'描述你想要的组件、页面或前端问题…',
  inputHint:'Enter 发送 · Shift+Enter 换行',
  resetChip:'↺ 重置',
  toggleTheme:'切换主题',preview:'预览',settings:'设置',
  previewTitle:'实时预览',
  providerModalTitle:'LLM 供应商管理',
  thID:'标识',thProtocol:'协议',thModel:'模型',thKey:'密钥',thActions:'操作',
  addProvider:'添加供应商',editProvider:'编辑供应商',
  lblID:'标识符',lblProtocol:'通信协议',lblURL:'Base URL',
  lblKey:'API Key（编辑时留空保留原值）',lblModel:'模型名称',lblPriority:'优先级（小者优先）',
  clearBtn:'清空',saveBtn:'保存',copyBtn:'复制',copiedBtn:'已复制',
  msgYou:'你',msgAgent:'LongCat',
  thinking:'思考中…',sessionReset:'会话已重置',
  noProviders:'暂无供应商，点 ⚙ 添加',
  confirmDelete:'删除供应商 {id}？',
  toastSaved:'已保存',toastDeleted:'已删除',toastSwitched:'已切换到 {id}',
  errorPrefix:'✖ ',
 },
 'en-US':{
  appName:'LongCat-frontend',appTitle:'LongCat-frontend',
  searchPlaceholder:'Search…',
  navChat:'Chat',navSkills:'Skills',navProviders:'Providers',
  providersTitle:'Providers',skillsTitle:'Frontend Skills',
  connected:'Connected',disconnected:'Disconnected',
  welcomeTitle:'What should we build today?',
  inputPlaceholder:'Describe the component, page or question…',
  inputHint:'Enter to send · Shift+Enter for newline',
  resetChip:'↺ Reset',
  toggleTheme:'Toggle theme',preview:'Preview',settings:'Settings',
  previewTitle:'Live Preview',
  providerModalTitle:'LLM Provider Management',
  thID:'ID',thProtocol:'Protocol',thModel:'Model',thKey:'Key',thActions:'Actions',
  addProvider:'Add Provider',editProvider:'Edit Provider',
  lblID:'Identifier',lblProtocol:'Protocol',lblURL:'Base URL',
  lblKey:'API Key (leave empty to keep)',lblModel:'Model Name',lblPriority:'Priority (lower first)',
  clearBtn:'Clear',saveBtn:'Save',copyBtn:'Copy',copiedBtn:'Copied',
  msgYou:'You',msgAgent:'LongCat',
  thinking:'Thinking…',sessionReset:'Session reset',
  noProviders:'No providers. Click ⚙ to add.',
  confirmDelete:'Delete provider {id}?',
  toastSaved:'Saved',toastDeleted:'Deleted',toastSwitched:'Switched to {id}',
  errorPrefix:'✖ ',
 }
};
let curLang=(localStorage.getItem('lang'))||((navigator.language||'zh-CN').startsWith('zh')?'zh-CN':'en-US');
function t(k){return (I18N[curLang]||{})[k]??k;}
function tf(k,vars){let s=t(k);for(const[a,b]of Object.entries(vars||{}))s=s.replace('{'+a+'}',b);return s;}
function applyI18n(){
  document.documentElement.lang=curLang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(t(k)!==k)el.textContent=t(k);});
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{const k=el.dataset.i18nPh;if(t(k)!==k)el.placeholder=t(k);});
  document.querySelectorAll('[data-i18n-title]').forEach(el=>{const k=el.dataset.i18nTitle;if(t(k)!==k)el.title=t(k);});
  $('btnLang').textContent=curLang==='zh-CN'?'EN':'中';
  document.title=t('appTitle');
  renderNav();
}
function toggleLang(){curLang=curLang==='zh-CN'?'en-US':'zh-CN';localStorage.setItem('lang',curLang);applyI18n();refresh();}

// ============================================================
// State & utils
// ============================================================
const $=id=>document.getElementById(id);
let state={providers:[],skills:[],protocols:[]};
let editing=null,busy=false,previewOn=false;
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);}
const catAvatar='<svg><use href="#longcat"/></svg>';

// ============================================================
// Render
// ============================================================
function renderNav(){
  $('sbNav').innerHTML=[
    {icon:'◈',key:'navChat',active:true},
    {icon:'◆',key:'navSkills',onclick:"document.getElementById('skillList').scrollIntoView({behavior:'smooth'})"},
    {icon:'⚙',key:'navProviders',onclick:'openModal()'}
  ].map(n=>`<button class="nav-item${n.active?' active':''}" ${n.onclick?`onclick="${n.onclick}"`:''}>
    <span class="ni">${n.icon}</span>${t(n.key)}</button>`).join('');
}


async function refresh(){
  try{
    const r=await fetch('/api/state');state=await r.json();
    $('connDot').style.background='var(--success)';$('connText').textContent=t('connected');
  }catch(e){
    $('connDot').style.background='var(--danger)';$('connText').textContent=t('disconnected');return;
  }
  $('providerList').innerHTML=state.providers.map(p=>
    `<div class="provider-row${p.active?' active':''}" onclick="useProvider('${esc(p.id)}')">
      <span class="pr-dot"></span><span class="pr-name">${esc(p.id)}</span>
      <span class="pr-info">${esc(p.model||p.protocol)}</span></div>`
  ).join('')||`<div class="sb-empty">${t('noProviders')}</div>`;

  $('skillList').innerHTML=state.skills.map(s=>
    `<div class="skill-item" title="${esc(s.description)}"><span class="sd"></span>${esc(s.name)}</div>`).join('');

  $('ptbody').innerHTML=state.providers.map(p=>
    `<tr><td>${p.active?'<span style="color:var(--success)">●</span>':''}</td>
     <td><b>${esc(p.id)}</b></td><td>${esc(p.protocol)}</td>
     <td>${esc(p.model||'—')}</td><td style="color:var(--text-tertiary)">${esc(p.key_redacted)}</td>
     <td><div class="p-actions">
       <button class="p-btn" onclick="useProvider('${esc(p.id)}')">✓</button>
       <button class="p-btn" onclick="editProvider('${esc(p.id)}')">✎</button>
       <button class="p-btn danger" onclick="removeProvider('${esc(p.id)}')">✕</button>
     </div></td></tr>`).join('');
  $('f_protocol').innerHTML=state.protocols.map(p=>`<option>${p}</option>`).join('');

  const act=state.providers.find(p=>p.active);
  $('chipModel').textContent=act?`◇ ${act.model||act.id}`:'◇ —';
  $('contextBar').innerHTML=[
    act?`<span class="ctx-chip">☁ ${esc(act.id)}</span>`:'',
    `<span class="ctx-chip">◆ ${state.skills.length} skills</span>`
  ].join('');
}

// ============================================================
// Provider CRUD
// ============================================================
async function useProvider(id){
  await fetch(`/api/providers/${encodeURIComponent(id)}/use`,{method:'POST'});
  toast(tf('toastSwitched',{id}));refresh();
}
function editProvider(id){
  const p=state.providers.find(x=>x.id===id);if(!p)return;
  editing=id;$('formTitle').textContent=t('editProvider')+' — '+id;
  $('f_id').value=p.id;$('f_id').disabled=true;$('f_url').value=p.url;
  $('f_protocol').value=p.protocol;$('f_model').value=p.model;
  $('f_priority').value=p.priority;$('f_key').value='';
}
function resetForm(){
  editing=null;$('formTitle').textContent=t('addProvider');$('f_id').disabled=false;
  ['f_id','f_url','f_key','f_model'].forEach(i=>$(i).value='');$('f_priority').value='0';
}
async function saveProvider(){
  const body={id:$('f_id').value.trim(),url:$('f_url').value.trim(),
    api_key:$('f_key').value,protocol:$('f_protocol').value,
    model:$('f_model').value.trim(),priority:+$('f_priority').value};
  const url=editing?`/api/providers/${encodeURIComponent(editing)}`:'/api/providers';
  const r=await fetch(url,{method:editing?'PUT':'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(j.error){toast(t('errorPrefix')+j.error);return;}
  toast(t('toastSaved'));resetForm();refresh();
}
async function removeProvider(id){
  if(!confirm(tf('confirmDelete',{id})))return;
  await fetch(`/api/providers/${encodeURIComponent(id)}`,{method:'DELETE'});
  toast(t('toastDeleted'));refresh();
}

// ============================================================
// Chat
// ============================================================
function addMsg(role){
  $('welcome').style.display='none';
  $('msgList').style.display='flex';
  const el=document.createElement('div');el.className='msg '+role;
  if(role==='user'){
    el.innerHTML='<div class="msg-body"></div>';
  }else{
    el.innerHTML=`<div class="msg-head"><div class="msg-avatar">${catAvatar}</div>
      <span class="msg-who">${t('msgAgent')}</span></div>
      <div class="skill-tags"></div><div class="msg-body"></div>`;
  }
  $('msgList').appendChild(el);return el;
}
function renderMd(el,text){
  const parts=text.split('```');let html='';
  parts.forEach((p,i)=>{
    if(i%2===1){const nl=p.indexOf('\n');
      const lang=nl>=0?p.slice(0,nl).trim():'';
      const code=nl>=0?p.slice(nl+1):p;
      const copyTxt=t('copyBtn');
      html+=`<div class="code-block"><div class="code-head"><span class="code-lang">${esc(lang)}</span><button class="code-copy" onclick="copyCode(this)">${esc(copyTxt)}</button></div><pre>${esc(code)}</pre></div>`;}
    else html+=esc(p);
  });el.innerHTML=html;
}
function copyCode(btn){
  const code=btn.closest('.code-block').querySelector('pre').textContent;
  navigator.clipboard.writeText(code).then(()=>{
    btn.textContent=t('copiedBtn');
    setTimeout(()=>btn.textContent=t('copyBtn'),1500);
  });
}
async function send(){
  const input=$('input');const text=input.value.trim();
  if(!text||busy)return;
  busy=true;$('btnSend').disabled=true;input.value='';autoGrow();
  const u=addMsg('user');u.querySelector('.msg-body').textContent=text;
  const a=addMsg('assistant');
  const body=a.querySelector('.msg-body');
  body.innerHTML=`<span style="color:var(--text-tertiary)">${t('thinking')}</span>`;
  let acc='';
  try{
    const resp=await fetch('/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const reader=resp.body.getReader();const dec=new TextDecoder();let buf='';
    for(;;){
      const{done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,idx);buf=buf.slice(idx+2);
        const ev=/event: (\w+)/.exec(chunk)?.[1];
        const dl=chunk.split('\n').find(l=>l.startsWith('data: '));
        if(!ev||!dl)continue;
        const data=JSON.parse(dl.slice(6));
        if(ev==='delta'){acc+=data;renderMd(body,acc);
          const sc=document.createElement('span');sc.className='stream-cursor';body.appendChild(sc);
          scrollBottom();}
        else if(ev==='skills'){a.querySelector('.skill-tags').innerHTML=
          data.map(n=>`<span class="st-tag">◆ ${esc(n)}</span>`).join('');}
        else if(ev==='error'){body.innerHTML=`<span style="color:var(--danger)">${t('errorPrefix')}${esc(data)}</span>`;}
      }
    }
    renderMd(body,acc);
    updatePreview(acc);
  }catch(e){
    body.innerHTML=`<span style="color:var(--danger)">${t('errorPrefix')}${esc(String(e))}</span>`;
  }
  busy=false;$('btnSend').disabled=false;scrollBottom();
}
function scrollBottom(){const c=$('chatArea');c.scrollTop=c.scrollHeight;}

// ============================================================
// Preview
// ============================================================
function togglePreview(){
  previewOn=!previewOn;
  $('previewPane').classList.toggle('open',previewOn);
}
function updatePreview(text){
  if(!previewOn)return;
  const m=[...text.matchAll(/```(?:html)?\n([\s\S]*?)```/g)];
  const code=m.length?m[m.length-1][1]:null;
  if(code&&/<[a-z][\s\S]*>/i.test(code))$('previewFrame').srcdoc=code;
}

// ============================================================
// Interactions
// ============================================================
function openModal(){resetForm();$('overlay').classList.add('open');}
function closeModal(){$('overlay').classList.remove('open');}
$('btnTheme').onclick=()=>{
  const d=document.documentElement;
  const dark=d.dataset.theme==='dark';
  d.dataset.theme=dark?'light':'dark';
  localStorage.setItem('theme',d.dataset.theme);
};
$('btnLang').onclick=toggleLang;
$('btnSettings').onclick=openModal;
$('btnSend').onclick=send;
$('btnPreviewToggle').onclick=togglePreview;
$('btnResetForm').onclick=resetForm;
$('btnSave').onclick=saveProvider;
$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal();};
$('chipReset').onclick=async()=>{
  await fetch('/api/reset',{method:'POST'});
  $('msgList').innerHTML='';$('msgList').style.display='none';
  $('welcome').style.display='';toast(t('sessionReset'));
};
const inputEl=$('input');
function autoGrow(){inputEl.style.height='auto';inputEl.style.height=Math.min(inputEl.scrollHeight,160)+'px';}
inputEl.addEventListener('input',autoGrow);
inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

// Init — 深色默认，记住用户选择
const savedTheme=localStorage.getItem('theme');
if(savedTheme)document.documentElement.dataset.theme=savedTheme;
applyI18n();refresh();
</script>
</body>
